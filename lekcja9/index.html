<!DOCTYPE html>
<html lang="pl">
<head>

    <title>Interaktywna strona</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Moja interaktywna strona</h1>
    <div class="container">
        <div class="card">
            <h2>Licznik</h2>
            <p id="counter-display">0</p>
            <!-- TODO: dodaj przycisk zwiększający licznik -->
             <button onclick="addPoint()">+1</button>
             <button onclick="reset()">reset</button>
        </div>
        <div class="card">
            <h2>Losowanie</h2>
            <p id="random-display">Kliknij i sprawdź!</p>
            <!-- TODO: dodaj przycisk uruchamiający losowanie -->
             <button onclick="kasyno()">losuj</button>
        </div>
        <div class="card">
            <h2>Widget</h2>
            <!-- TODO: osadź zewnętrzny widget za pomocą iframe -->
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d39253.2099868857!2d20.399374816172234!3d52.05559429534379!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x471944c794a8145b%3A0x81ced2f5df4d3278!2zxbt5cmFyZMOzdw!5e0!3m2!1spl!2spl!4v1795268708727!5m2!1spl!2spl" width="200" height="200" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <iframe src="https://www.autodraw.com/" width="200" height="200"
    </div>
    <script src="script.js"></script>
</body>
</html>
